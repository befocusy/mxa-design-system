<!-- @dsCard group="Colors" viewport="700x150" name="Accent & semantic" subtitle="Logo blue spark + status hues, used sparingly" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-body); background: var(--mxa-paper); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:24px; }
  .chip { height:72px; border-radius:6px; border:1px solid rgba(8,12,17,.08); }
  .name { font-size:12px; font-weight:500; color:var(--text-body); margin-top:8px; }
  .hex { font-size:11px; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px; }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="chip" style="background:var(--mxa-blue)"></div><div class="name">Blue (X accent)</div><div class="hex">#7ABBE5</div></div>
    <div><div class="chip" style="background:var(--mxa-blue-deep)"></div><div class="name">Blue deep / link</div><div class="hex">#4F87AD</div></div>
    <div><div class="chip" style="background:var(--mxa-success)"></div><div class="name">Success</div><div class="hex">#5C7C58</div></div>
    <div><div class="chip" style="background:var(--mxa-danger)"></div><div class="name">Danger</div><div class="hex">#B23A30</div></div>
  </div>
</body>
</html>
