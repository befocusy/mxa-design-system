<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — 4 to 96" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-body); background: var(--mxa-paper); padding:24px 32px; }
  .row { display:flex; align-items:flex-end; gap:18px; }
  .item { text-align:center; }
  .bar { background:var(--mxa-taupe); border-radius:2px; width:22px; }
  .v { font-family:var(--font-mono); font-size:11px; color:var(--mxa-stone); margin-top:8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><div class="v">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="v">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="v">16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="v">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="v">32</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="v">48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="v">64</div></div>
    <div class="item"><div class="bar" style="height:88px"></div><div class="v">96</div></div>
  </div>
</body>
</html>
