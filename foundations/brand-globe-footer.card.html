<!-- @dsCard group="Brand" viewport="700x170" name="Globe motif & footer" subtitle="LATAM reach mark + standard document footer" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-body); background:var(--mxa-white); padding:24px 32px; display:flex; flex-direction:column; justify-content:space-between; height:170px; box-sizing:border-box; }
  .top { display:flex; align-items:center; gap:22px; }
  .globe { height:64px; opacity:.9; }
  .reach { font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--mxa-ink); }
  .reach span { color:var(--mxa-taupe); }
  .sub { font-size:12px; color:var(--mxa-stone); margin-top:4px; }
  .footer { border-top:1px solid var(--mxa-sand); padding-top:10px; display:flex; gap:14px; font-size:11px; color:var(--mxa-stone); align-items:center; }
  .footer .b { color:var(--mxa-charcoal); font-weight:500; }
  .dot { width:3px;height:3px;border-radius:50%;background:var(--mxa-taupe); }
</style>
</head>
<body>
  <div class="top">
    <img class="globe" src="../assets/brand/globe-motif.png" alt="globe">
    <div>
      <div class="reach">Uruguay <span>·</span> toda Latinoamérica</div>
      <div class="sub">The line-art globe signals MXA's regional reach.</div>
    </div>
  </div>
  <div class="footer">
    <span class="b">mxa.com.uy</span><span class="dot"></span>
    <span>Bvr. Gral. Artigas 417 piso 7, Punta Carretas</span><span class="dot"></span>
    <span>Montevideo, Uruguay</span><span class="dot"></span>
    <span>(+598) 2712 6550</span>
  </div>
</body>
</html>
