<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-body); display:grid; grid-template-columns:1fr 1fr; height:150px; }
  .panel { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  .light { background:var(--mxa-paper); }
  .dark { background:var(--mxa-ink); }
  img { height:46px; }
  .tag { font-family:var(--font-display); font-weight:500; font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="panel light">
    <img src="../assets/logos/mxa-logo.svg" alt="mxa">
    <div class="tag" style="color:var(--mxa-charcoal)">Tax · Accounting · Legal · Notary</div>
  </div>
  <div class="panel dark">
    <img src="../assets/logos/mxa-logo-white.svg" alt="mxa">
    <div class="tag" style="color:var(--mxa-taupe)">Tax · Accounting · Legal · Notary</div>
  </div>
</body>
</html>
