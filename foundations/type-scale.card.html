<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Editorial document rhythm, 11 → 56px" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-body); background: var(--mxa-paper); padding:22px 32px; color:var(--mxa-ink); }
  .r { display:flex; align-items:baseline; gap:18px; padding:5px 0; border-bottom:1px solid var(--mxa-sand); }
  .r:last-child { border-bottom:0; }
  .tok { font-family:var(--font-mono); font-size:11px; color:var(--mxa-stone); width:64px; flex:none; }
  .px { font-family:var(--font-mono); font-size:11px; color:var(--mxa-taupe); width:44px; flex:none; }
  .samp { font-family:var(--font-display); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
  <div class="r"><span class="tok">4xl</span><span class="px">56</span><span class="samp" style="font-size:34px">MXA Asesores</span></div>
  <div class="r"><span class="tok">2xl</span><span class="px">28</span><span class="samp" style="font-size:24px">Honorarios profesionales</span></div>
  <div class="r"><span class="tok">xl</span><span class="px">22</span><span class="samp" style="font-size:20px">Alcance de los servicios</span></div>
  <div class="r"><span class="tok">lg</span><span class="px">18</span><span class="samp" style="font-size:17px; font-family:var(--font-body); font-weight:400">Lead paragraph in Roboto</span></div>
  <div class="r"><span class="tok">base</span><span class="px">16</span><span class="samp" style="font-size:15px; font-family:var(--font-body); font-weight:400">Body copy at relaxed leading</span></div>
</body>
</html>
