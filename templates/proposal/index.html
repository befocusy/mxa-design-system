<!-- @template name="Propuesta de servicios" description="A4 client proposal — dark cover + content page, ready to fill in" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MXA — Propuesta</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d8d2c8; font-family: var(--font-body); padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .a4 { width: 794px; min-height: 1123px; background: var(--mxa-paper); color: var(--mxa-ink); padding: 64px 72px 40px; display: flex; flex-direction: column; box-shadow: 0 18px 48px rgba(8,12,17,.18); }
  .a4--ink { background: var(--mxa-ink); color: var(--mxa-paper); justify-content: space-between; }
  .a4__body { flex: 1; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .head img { height: 24px; }
  .head span { font-family: var(--font-display); font-weight: 500; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--mxa-taupe); }
  .cover-logo { height: 42px; align-self: flex-start; }
  .cover-tag { font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--mxa-taupe); margin-top: 14px; }
  .cover-eyebrow { font-family: var(--font-display); font-weight: 500; font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: var(--mxa-taupe); margin: 0 0 18px; }
  .cover-title { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -.02em; margin: 0; }
  .cover-client { font-size: 16px; color: var(--mxa-taupe); margin: 28px 0 0; }
  .body-p { font-size: 14px; line-height: 1.7; color: var(--mxa-charcoal); margin: 0 0 16px; max-width: 60ch; }
</style>
</head>
<body>
  <!-- COVER -->
  <section class="a4 a4--ink">
    <div>
      <img class="cover-logo" src="../../assets/logos/mxa-logo-white.svg" alt="mxa">
      <div class="cover-tag">Tax · Accounting · Legal · Notary</div>
    </div>
    <div>
      <p class="cover-eyebrow">Mayo 2026</p>
      <h1 class="cover-title">Propuesta<br>de servicios</h1>
      <p class="cover-client">Para: [Cliente] S.R.L.</p>
    </div>
    <div id="cover-foot"></div>
  </section>

  <!-- CONTENT -->
  <section class="a4">
    <div class="a4__body">
      <div class="head">
        <img src="../../assets/logos/mxa-logo.svg" alt="mxa">
        <span>Tax · Accounting · Legal · Notary</span>
      </div>
      <div id="section-label"></div>
      <p class="body-p" style="margin-top:24px">[Reemplazá este párrafo con el contexto del encargo. Mantené el tono formal en tercera persona, dirigiéndote al cliente de usted.]</p>
      <div id="clauses"></div>
      <div id="fees" style="margin-top:24px"></div>
    </div>
    <div id="page-foot"></div>
  </section>

  <script type="text/babel" data-presets="react">
    window.addEventListener('DOMContentLoaded', () => {
      const DS = window.MXADesignSystem_5dc0a4;
      if (!DS) { console.warn('MXA bundle not loaded yet'); return; }
      const { SectionLabel, ClauseList, DataTable, DocFooter } = DS;
      const r = (id, node) => ReactDOM.createRoot(document.getElementById(id)).render(node);
      r('cover-foot', <DocFooter onInk />);
      r('section-label', <SectionLabel eyebrow="Alcance de los servicios" title="Servicios de consultoría" />);
      r('clauses', <ClauseList marker="bullet" items={[
        '[Primer punto del alcance]',
        '[Segundo punto del alcance]',
      ]} />);
      r('fees', <DataTable
        columns={[
          { key: 'c', label: 'Concepto', strong: true },
          { key: 'd', label: 'Detalle' },
          { key: 'h', label: 'Honorarios', align: 'right' },
        ]}
        rows={[{ c: '[Concepto]', d: '[Detalle]', h: 'USD 0.000' }]} />);
      r('page-foot', <DocFooter page="02 / 02" />);
    });
  </script>
</body>
</html>
